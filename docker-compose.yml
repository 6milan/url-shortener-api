# Local development:   docker compose up -d redis db
# Full production-like stack:   docker compose --profile app up --build
x-app: &app
  build: .
  env_file: .env.docker
  profiles: [app]

services:
  redis:
    image: redis:7-alpine
    # appendonly keeps queued Celery tasks (clicks!) across a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency=4
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  beat:
    <<: *app
    command: celery -A config beat -l info
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  redis-data:
  pg-data:
